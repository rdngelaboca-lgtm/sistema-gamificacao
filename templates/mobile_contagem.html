<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <!-- Essa linha impede que o tablet dê zoom sozinho quando você clica num campo -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📱 Contagem de Estoque</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f7fa; margin: 0; padding: 15px; }
        h2 { color: #0056b3; text-align: center; margin-bottom: 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 15px; }
        label { font-weight: bold; color: #555; display: block; margin-bottom: 8px; }
        input { width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 8px; border: 2px solid #ddd; font-size: 18px; box-sizing: border-box; }
        input:focus { border-color: #007bff; outline: none; }
        button { width: 100%; padding: 15px; border-radius: 8px; border: none; font-size: 18px; font-weight: bold; color: white; background-color: #007bff; cursor: pointer; }
        button:active { background-color: #0056b3; transform: scale(0.98); }
        .btn-success { background-color: #28a745; margin-top: 10px; }
        .btn-success:active { background-color: #1e7e34; }
        .item-lista { border-bottom: 1px solid #eee; padding: 12px 0; display: flex; justify-content: space-between; align-items: center; }
        .item-lista:last-child { border-bottom: none; }
        .qtd-badge { background-color: #007bff; color: white; padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 1.2em;}
    </style>
</head>
<body>
    <h2>📦 Contagem Estoque (Tablet)</h2>

    <!-- Bloco 1: Leitor de Código de Barras -->
    <div class="card">
        <label>Bipar Código de Barras (EAN):</label>
        <input type="number" id="input-ean" placeholder="Bipe ou digite o código..." autofocus>
        <button onclick="buscarProduto()">🔍 Buscar Item</button>
    </div>
    
    <!-- Bloco 2: Lançamento de Quantidade (Fica oculto até achar o produto) -->
    <div class="card" id="card-resultado" style="display: none; border-left: 5px solid #28a745;">
        <h3 id="nome-produto" style="color: #333; margin-top: 0; font-size: 1.3em;"></h3>
        <p style="color: #666; font-size: 1.1em;">Custo Última Compra: <strong id="custo-produto"></strong></p>
        <label>Quantidade Física na Prateleira:</label>
        <input type="number" id="input-qtd" step="0.001" placeholder="Ex: 5 ou 2.500">
        <button class="btn-success" onclick="adicionarAContagem()">➕ Lançar Quantidade</button>
    </div>

    <!-- Bloco 3: Memória do Tablet (Carrinho) -->
    <div class="card">
        <h3 style="margin-top: 0; color: #555;">📝 Itens nesta Sessão:</h3>
        <div id="lista-itens">
            <p style="color: #999; text-align: center; font-style: italic;">Nenhum item bipado ainda.</p>
        </div>
        <button class="btn-success" style="background-color: #5a3e8d; margin-top: 20px;" onclick="salvarContagem()">💾 Enviar para o Computador Central</button>
    </div>

    <script>
        let produtoAtual = null;
        let listaContagem = [];

        // Ouve a tecla "Enter" (Leitores de código de barras dão um "Enter" automático)
        document.getElementById('input-ean').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') buscarProduto();
        });

        async function buscarProduto() {
            const ean = document.getElementById('input-ean').value;
            if (!ean) return;
            
            try {
                // Chama a rota criada no api_server.py
                const response = await fetch(`/api/produto/ean/${ean}`);
                if (response.ok) {
                    const data = await response.json();
                    produtoAtual = data;
                    document.getElementById('nome-produto').innerText = `${data.nome} (${data.unidade})`;
                    document.getElementById('custo-produto').innerText = `R$ ${data.custo.toFixed(2).replace('.', ',')}`;
                    document.getElementById('card-resultado').style.display = 'block';
                    
                    // Joga o cursor para o campo de quantidade automaticamente para ganhar tempo
                    document.getElementById('input-qtd').focus();
                } else {
                    alert("⚠️ Produto não encontrado no sistema!\n\nVerifique se o código está correto ou se o produto está vinculado a um EAN no Catálogo Mestre.");
                    document.getElementById('input-ean').value = "";
                }
            } catch (e) {
                alert("❌ Erro de conexão de rede com o Servidor (Computador).");
            }
        }

        function adicionarAContagem() {
            const qtdInput = document.getElementById('input-qtd').value.replace(',', '.');
            const qtd = parseFloat(qtdInput);
            
            if (!qtd || qtd < 0) {
                alert("Por favor, digite uma quantidade válida maior ou igual a zero.");
                return;
            }
            
            // Adiciona na memória (array)
            listaContagem.push({
                ProdutoID: produtoAtual.id,
                NomeProduto: produtoAtual.nome,
                QuantidadeContada: qtd
            });
            
            // Reseta a tela para bipar o próximo produto rapidamente
            document.getElementById('input-ean').value = "";
            document.getElementById('input-qtd').value = "";
            document.getElementById('card-resultado').style.display = 'none';
            document.getElementById('input-ean').focus();
            
            renderizarLista();
        }

        function renderizarLista() {
            const div = document.getElementById('lista-itens');
            div.innerHTML = "";
            
            listaContagem.forEach((item) => {
                div.innerHTML += `
                <div class="item-lista">
                    <span style="font-size: 1.1em; font-weight: bold;">${item.NomeProduto}</span>
                    <span class="qtd-badge">${item.QuantidadeContada}</span>
                </div>`;
            });
        }

        async function salvarContagem() {
            if (listaContagem.length === 0) {
                alert("Sua lista está vazia. Bipe produtos primeiro.");
                return;
            }
            
            // Pergunta o nome da contagem
            const nomeRef = prompt("Dê um nome para esta coleta (Ex: Corredor A, Prateleira 2):", "Coleta Mobile");
            if (!nomeRef) return; // Cancelou

            // Monta o pacote de dados exigido pela rota do Python
            const payload = {
                nome_contagem: nomeRef,
                itens: listaContagem,
                funcionario_id: 2 // Pode ser ajustado para um ID logado depois
            };

            try {
                // Chama a rota criada no api_server.py
                const response = await fetch('/api/contagem/salvar-mobile', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (response.ok) {
                    alert("✅ Contagem salva com sucesso no Computador Central!");
                    listaContagem = []; // Esvazia o carrinho do tablet
                    document.getElementById('lista-itens').innerHTML = '<p style="color: #28a745; text-align: center; font-weight: bold;">Sessão enviada com sucesso!</p>';
                } else {
                    const errorData = await response.json();
                    alert(`❌ Erro no Servidor: ${errorData.erro}`);
                }
            } catch (e) {
                alert("❌ Erro de rede Wi-Fi ao tentar enviar para o Servidor.");
            }
        }
    </script>
</body>
</html>
