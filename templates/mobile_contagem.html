<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Contagem Estoque 📱</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding: 10px; display: flex; flex-direction: column; height: 100vh; }
        .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 10px; }

        h2 { margin: 0 0 10px 0; color: #333; font-size: 1.2rem; }

        .input-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }

        input[type="number"], input[type="text"] {
            width: 100%; padding: 15px; font-size: 1.2rem; border: 2px solid #007bff; border-radius: 8px; box-sizing: border-box;
        }

        /* Destaque para o campo de código de barras */
        #ean-input { background-color: #e8f0fe; }
        #ean-input:focus { border-color: #0056b3; outline: none; }

        .lista-itens { flex: 1; overflow-y: auto; background: white; border-radius: 10px; padding: 10px; }
        .item-lista { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 10px; border-bottom: 1px solid #eee; animation: flash 0.5s; 
        }
        .item-nome { font-weight: bold; font-size: 0.9rem; }
        .item-qtd { color: #007bff; font-weight: bold; }
        .btn-del { color: red; font-size: 1.2rem; cursor: pointer; padding: 0 10px; }

        .btn-salvar {
            background: #28a745; color: white; border: none; padding: 15px; 
            font-size: 1.2rem; border-radius: 8px; width: 100%; cursor: pointer; margin-top: 10px;
        }

        .status-msg { text-align: center; font-weight: bold; margin-bottom: 5px; height: 20px; }
        .sucesso { color: green; }
        .erro { color: red; }

        @keyframes flash {
            0% { background-color: #ccffcc; }
            100% { background-color: white; }
        }
    </style>
</head>
<body>

    <div class="card">
        <div id="status" class="status-msg">Pronto para bipar...</div>

        <div class="input-group">
            <label>Quantidade (Padrão: 1)</label>
            <input type="number" id="qtd-input" value="1" min="0.1" step="0.1">
        </div>

        <div class="input-group">
            <label>Código de Barras (Bipar aqui)</label>
            <input type="number" id="ean-input" placeholder="Aguardando leitor..." autofocus>
        </div>
    </div>

    <div class="lista-itens" id="lista-contagem">
        <div style="text-align: center; color: #888; margin-top: 20px;">Nenhum item contado.</div>
    </div>

    <button class="btn-salvar" onclick="finalizarContagem()">💾 Salvar Contagem</button>

    <script>
        const eanInput = document.getElementById('ean-input');
        const qtdInput = document.getElementById('qtd-input');
        const listaEl = document.getElementById('lista-contagem');
        const statusEl = document.getElementById('status');

        let itensContados = []; 

        // Mantém o foco no campo de Bipagem sempre que possível
        document.body.addEventListener('click', (e) => {
            if(document.activeElement !== qtdInput && e.target.className !== 'btn-del' && e.target.className !== 'btn-salvar') {
                eanInput.focus();
            }
        });

        // Evento de "Enter" no campo EAN (O leitor envia um Enter no final)
        eanInput.addEventListener('keypress', async function (e) {
            if (e.key === 'Enter') {
                const ean = eanInput.value;
                const qtd = parseFloat(qtdInput.value);

                if (!ean) return;

                eanInput.value = ''; // Limpa rápido para o próximo
                statusEl.textContent = "Buscando...";
                statusEl.className = "status-msg";

                try {
                    const response = await fetch(`/api/produto/ean/${ean}`);

                    if (response.ok) {
                        const prod = await response.json();
                        adicionarItemLista(prod, qtd);
                        statusEl.textContent = `✅ ${prod.nome}`;
                        statusEl.className = "status-msg sucesso";
                    } else {
                        statusEl.textContent = "❌ EAN Não encontrado!";
                        statusEl.className = "status-msg erro";
                        if(navigator.vibrate) navigator.vibrate(200);
                    }
                } catch (error) {
                    statusEl.textContent = "Erro de conexão";
                    statusEl.className = "status-msg erro";
                }
            }
        });

        function adicionarItemLista(prod, qtdDigitada) {
            // Aplica fator se for caixa (o banco retorna o fator)
            const qtdReal = qtdDigitada * prod.fator;

            // Adiciona ao array de dados
            itensContados.push({
                ProdutoID: prod.id,
                QuantidadeContada: qtdReal,
                _nome: prod.nome, // Para exibição
                _un: prod.unidade // Para exibição
            });

            renderizarLista();
        }

        function renderizarLista() {
            if (itensContados.length === 0) {
                listaEl.innerHTML = '<div style="text-align: center; color: #888; margin-top: 20px;">Nenhum item contado.</div>';
                return;
            }

            listaEl.innerHTML = '';

            // Inverte para o último bipado aparecer no topo
            [...itensContados].reverse().forEach((item, index) => {
                const realIndex = itensContados.length - 1 - index;

                const div = document.createElement('div');
                div.className = 'item-lista';
                div.innerHTML = `
                    <div>
                        <div class="item-nome">${item._nome}</div>
                        <small>ID: ${item.ProdutoID}</small>
                    </div>
                    <div style="display:flex; align-items:center;">
                        <span class="item-qtd">${item.QuantidadeContada} ${item._un}</span>
                        <span class="btn-del" onclick="removerItem(${realIndex})">🗑️</span>
                    </div>
                `;
                listaEl.appendChild(div);
            });
        }

        function removerItem(index) {
            if(confirm("Remover este item?")) {
                itensContados.splice(index, 1);
                renderizarLista();
            }
        }

        async function finalizarContagem() {
            if (itensContados.length === 0) {
                alert("A lista está vazia!");
                return;
            }

            if(!confirm(`Confirmar contagem de ${itensContados.length} tipos de itens?`)) return;

            const btn = document.querySelector('.btn-salvar');
            btn.disabled = true;
            btn.textContent = "Enviando...";

            try {
                const payload = {
                    funcionario_id: 2, // ID do Gestor (Hardcoded por enquanto)
                    itens: itensContados
                };

                const res = await fetch('/api/contagem/salvar-mobile', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });

                const data = await res.json();

                if (res.ok) {
                    alert("✅ Contagem salva com sucesso!");
                    itensContados = []; // Limpa
                    renderizarLista();
                    statusEl.textContent = "Contagem finalizada.";
                } else {
                    alert("Erro: " + data.erro);
                }
            } catch (e) {
                alert("Erro de conexão ao salvar.");
            } finally {
                btn.disabled = false;
                btn.textContent = "💾 Salvar Contagem";
            }
        }
    </script>
</body>
</html>
