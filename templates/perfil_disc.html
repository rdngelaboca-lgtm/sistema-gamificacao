<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E6B63">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Gela Boca · Avaliação de perfil</title>
<!-- [PERFIL DISC] Página PÚBLICA do link do WhatsApp: /perfil/<código>. O questionário (24 grupos de 4 palavras:
     a que MAIS e a que MENOS parece com a pessoa) e, no fim, um resumo positivo do perfil. Nada da Gestão aparece aqui. -->
<style>
  :root { --verde: #0E6B63; --verde-esc: #0B564F; --verde-claro: #DDEFEC; --texto: #16201F; --suave: #55625F; --linha: #DCE3E1;
    --erro: #c62828; --mais: #1b7f3a; --mais-claro: #e3f4e8; --menos: #b3261e; --menos-claro: #fbe9e7;
    --D: #e53935; --I: #f9a825; --S: #43a047; --C: #1e88e5; }
  * { box-sizing: border-box; }
  html { background: #F3F6F5; }
  body { margin: 0; min-height: 100vh; background: linear-gradient(180deg, #DDEFEC 0%, #F3F6F5 260px) no-repeat; color: var(--texto);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 16px; }
  main { max-width: 520px; margin: 0 auto; padding: 18px 16px 40px; }
  .topo { text-align: center; margin-bottom: 12px; }
  .topo .marca { font-size: 26px; font-weight: 800; color: var(--verde-esc); }
  .cartao { background: #fff; border: 1px solid var(--linha); border-radius: 18px; padding: 18px; display: grid; gap: 14px; box-shadow: 0 6px 20px #0E6B6314; }
  h1 { font-size: 22px; margin: 0; line-height: 1.25; }
  h2 { font-size: 19px; margin: 0; line-height: 1.3; }
  p { margin: 0; line-height: 1.5; }
  .mini { font-size: 13px; color: var(--suave); line-height: 1.45; }
  .passos { margin: 0; padding-left: 20px; line-height: 1.55; }
  .pontos { border-radius: 12px; padding: 10px 14px; font-weight: 700; background: #FFF6D6; color: #6B4E00; border: 1px solid #F1DE9C; }
  button { font: inherit; cursor: pointer; }
  .prim { font-weight: 800; font-size: 19px; border-radius: 14px; padding: 15px; border: 0; background: var(--verde); color: #fff; width: 100%; }
  .prim[disabled] { opacity: .55; cursor: default; }
  .sec { font-weight: 700; font-size: 15px; border-radius: 12px; padding: 10px 14px; border: 1px solid var(--linha); background: #fff; color: var(--texto); }
  .linha-btn { display: flex; gap: 8px; justify-content: space-between; align-items: center; }
  button:focus-visible { outline: 2px solid var(--verde-esc); outline-offset: 2px; }
  .progresso { display: grid; gap: 6px; }
  .progresso .barra { height: 8px; border-radius: 6px; background: #e4ebe9; overflow: hidden; }
  .progresso .barra span { display: block; height: 100%; background: var(--verde); transition: width .25s; }
  .pergunta { font-size: 18px; font-weight: 800; line-height: 1.3; }
  .pergunta .mais { color: var(--mais); } .pergunta .menos { color: var(--menos); }
  .palavras { display: grid; gap: 10px; }
  .palavra { text-align: left; font-size: 19px; font-weight: 700; padding: 15px 16px; border-radius: 14px; border: 2px solid var(--linha);
    background: #fff; color: var(--texto); display: flex; justify-content: space-between; align-items: center; min-height: 56px; }
  .palavra.mais { border-color: var(--mais); background: var(--mais-claro); }
  .palavra.menos { border-color: var(--menos); background: var(--menos-claro); }
  .palavra .marca-esc { font-size: 14px; font-weight: 800; }
  .palavra.mais .marca-esc { color: var(--mais); } .palavra.menos .marca-esc { color: var(--menos); }
  .palavra[disabled] { cursor: default; }
  .fatores { display: grid; gap: 8px; }
  .fator { display: grid; grid-template-columns: 120px 1fr; gap: 8px; align-items: center; font-size: 14px; font-weight: 700; }
  .fator .b { height: 12px; border-radius: 7px; background: #eef2f1; overflow: hidden; }
  .fator .b span { display: block; height: 100%; }
  .perfil-grande { font-size: 24px; font-weight: 800; text-align: center; line-height: 1.3; }
  .lista { margin: 0; padding-left: 20px; line-height: 1.6; }
  .grande { font-size: 54px; text-align: center; line-height: 1; }
  #erro { color: var(--erro); font-weight: 700; min-height: 1.2em; }
  .carregando { text-align: center; color: var(--suave); padding: 30px 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="topo"><div class="marca" id="marca">🍦 Gela Boca</div></div>
  <div class="cartao" id="tela"><div class="carregando">Carregando…</div></div>
  <div id="erro" role="alert" style="margin-top:10px"></div>
</main>
<script>
'use strict';
const $ = s => document.querySelector(s);
const TOKEN = location.pathname.split('/').filter(Boolean)[1] || '';
const URL_API = `/api/perfil/${encodeURIComponent(TOKEN)}`;
const CHAVE = 'disc:' + TOKEN;                 // o andamento fica no celular: dá para fechar e continuar depois
const COR = {D: 'var(--D)', I: 'var(--I)', S: 'var(--S)', C: 'var(--C)'};
let D = null, R = [], idx = 0, fase = 'inicio';
const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));

function ler() { try { const x = JSON.parse(localStorage.getItem(CHAVE) || 'null'); return x && Array.isArray(x.r) ? x : null; } catch (e) { return null; } }
function gravar() { try { localStorage.setItem(CHAVE, JSON.stringify({r: R, i: idx})); } catch (e) {} }
function limpar() { try { localStorage.removeItem(CHAVE); } catch (e) {} }

async function chamar(metodo, corpo) {
  let r;
  try {
    r = await fetch(URL_API, {method: metodo, credentials: 'omit', cache: 'no-store',
      headers: corpo ? {'Content-Type': 'application/json'} : {}, body: corpo ? JSON.stringify(corpo) : undefined});
  } catch (e) { throw new Error('Sem internet. Suas respostas ficam guardadas: tente de novo.'); }
  let d = {};
  try { d = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(d.erro || 'Não deu certo. Tente de novo.');
  return d;
}

function telaInicio() {
  const salvo = ler(), feitos = salvo ? salvo.r.filter(x => x && x[1] != null).length : 0;
  $('#tela').innerHTML = `
    <div class="grande">🧭</div>
    <h1>Olá${D.nome ? ', ' + esc(D.nome) : ''}! Vamos conhecer o seu perfil?</h1>
    <p>São <b>${D.blocos.length} grupos de 4 palavras</b>. Em cada grupo:</p>
    <ol class="passos"><li>toque na palavra que <b style="color:var(--mais)">MAIS</b> parece com você no trabalho;</li>
      <li>depois, na que <b style="color:var(--menos)">MENOS</b> parece.</li></ol>
    <p>Não existe resposta certa ou errada. Responda como você <b>é</b> no dia a dia, não como gostaria de ser. Leva uns 10 minutos.</p>
    ${D.pontos ? `<div class="pontos">⭐ Respondendo você ganha ${D.pontos} pontos na gamificação!</div>` : ''}
    <button class="prim" id="comecar">${feitos ? `Continuar (${feitos} de ${D.blocos.length} feitos)` : 'Começar'}</button>
    <div class="mini">🔒 Suas respostas ficam só com a gestão da ${esc(D.empresa)}, para organizar a equipe e ajudar no seu
      desenvolvimento. É um retrato do seu jeito de trabalhar, não uma prova.</div>`;
  $('#comecar').onclick = () => {
    if (salvo) { R = salvo.r; idx = Math.min(salvo.i || 0, D.blocos.length - 1); }
    while (idx < D.blocos.length - 1 && R[idx] && R[idx][1] != null) idx++;
    fase = 'perguntas';
    if (R.length === D.blocos.length && R.every(x => x && x[0] != null && x[1] != null)) return telaFim();
    telaGrupo();
  };
}

function telaGrupo() {
  const n = D.blocos.length, r = R[idx] || [null, null], palavras = D.blocos[idx];
  const passo = r[0] == null ? 'mais' : 'menos';
  const feitos = R.filter(x => x && x[1] != null).length;
  $('#tela').innerHTML = `
    <div class="progresso"><div class="mini" style="display:flex;justify-content:space-between"><span>Grupo ${idx + 1} de ${n}</span>
      <span>${Math.round(100 * feitos / n)}%</span></div><div class="barra"><span style="width:${100 * feitos / n}%"></span></div></div>
    <div class="pergunta" id="pergunta">${passo === 'mais' ? 'Qual destas palavras <span class="mais">MAIS</span> parece com você?'
      : 'E qual <span class="menos">MENOS</span> parece com você?'}</div>
    <div class="palavras">${palavras.map((p, i) => `<button class="palavra ${r[0] === i ? 'mais' : r[1] === i ? 'menos' : ''}" data-i="${i}"
        ${r[0] === i && passo === 'menos' ? 'disabled' : ''}>${esc(p)}<span class="marca-esc">${r[0] === i ? '👍 MAIS' : r[1] === i ? '👎 MENOS' : ''}</span></button>`).join('')}</div>
    <div class="linha-btn"><button class="sec" id="voltar" ${idx === 0 && passo === 'mais' ? 'disabled' : ''}>← Voltar</button>
      ${passo === 'menos' ? '<button class="sec" id="trocar">↩️ Trocar o MAIS</button>' : '<span></span>'}</div>`;
  document.querySelectorAll('.palavra').forEach(b => b.onclick = () => escolher(+b.dataset.i));
  $('#voltar').onclick = () => {
    if (passo === 'menos') { R[idx] = [null, null]; }
    else if (idx > 0) { idx--; R[idx] = [R[idx] ? R[idx][0] : null, null]; }
    gravar(); telaGrupo();
  };
  const t = $('#trocar'); if (t) t.onclick = () => { R[idx] = [null, null]; gravar(); telaGrupo(); };
}

let andando = false;
function escolher(i) {
  if (andando) return;
  const r = R[idx] || [null, null];
  if (r[0] == null) { R[idx] = [i, null]; gravar(); return telaGrupo(); }
  if (i === r[0]) return;
  R[idx] = [r[0], i]; gravar(); telaGrupo();
  andando = true;
  setTimeout(() => {                                       // um instante para a pessoa ver o que marcou
    andando = false;
    if (idx < D.blocos.length - 1) { idx++; gravar(); telaGrupo(); } else telaFim();
  }, 350);
}

function telaFim() {
  fase = 'fim';
  $('#tela').innerHTML = `
    <div class="grande">✅</div>
    <h2>Pronto! Você respondeu os ${D.blocos.length} grupos.</h2>
    <p>Toque em <b>Enviar respostas</b> para ver o seu resultado.</p>
    <button class="prim" id="enviar">Enviar respostas</button>
    <div class="linha-btn"><button class="sec" id="voltar">← Voltar e conferir</button><span></span></div>`;
  $('#voltar').onclick = () => { idx = D.blocos.length - 1; telaGrupo(); };
  $('#enviar').onclick = async () => {
    $('#erro').textContent = ''; $('#enviar').disabled = true;
    try {
      const faltam = D.blocos.map((_, k) => k).filter(k => !R[k] || R[k][0] == null || R[k][1] == null);
      if (faltam.length) { idx = faltam[0]; telaGrupo(); throw new Error(`Falta responder o grupo ${faltam[0] + 1}.`); }
      D = await chamar('POST', {respostas: R}); limpar(); telaResultado();
    } catch (e) { $('#erro').textContent = e.message; const b = $('#enviar'); if (b) b.disabled = false; }
  };
}

function telaResultado() {
  const r = D.resultado;
  $('#tela').innerHTML = `
    <div class="grande">🙌</div>
    <h2 style="text-align:center">Obrigado${D.nome ? ', ' + esc(D.nome) : ''}!</h2>
    <div class="mini" style="text-align:center">O seu perfil é</div>
    <div class="perfil-grande" id="perfil">${esc(r.nome)}</div>
    <p>${esc(r.texto)}</p>
    <div><b>Seus pontos fortes</b><ul class="lista">${r.fortes.map(f => `<li>${esc(f)}</li>`).join('')}</ul></div>
    <div class="fatores">${r.fatores.map(f => `<div class="fator"><span>${f.emoji} ${esc(f.nome)}</span>
      <div class="b"><span style="width:${Math.min(100, f.pct * 2)}%;background:${COR[f.d]}"></span></div></div>`).join('')}</div>
    ${D.pontos ? `<div class="pontos">⭐ +${D.pontos} pontos na gamificação.</div>` : ''}
    <div class="mini">Todo mundo tem um pouco de cada cor; a maior mostra o seu jeito mais natural de trabalhar. É uma tendência,
      não um rótulo: a gestão vai usar para organizar a equipe do jeito que combina com cada um.</div>`;
}

(async () => {
  try {
    D = await chamar('GET');
    $('#marca').textContent = '🍦 ' + (D.empresa || 'Gela Boca');
    if (D.respondido) { limpar(); telaResultado(); } else telaInicio();
  } catch (e) {
    $('#tela').innerHTML = '<div class="grande">🔗</div>'; $('#erro').textContent = e.message;
  }
})();
</script>
</body>
</html>
