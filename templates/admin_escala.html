<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Escala Inteligente</title>
    <link rel="stylesheet" href="/static/css/admin_escala.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    
    <header class="top-bar">
        <div class="logo">🎮 Gamificação Admin</div>
        <div class="date-controls">
            <button onclick="mudarDia(-1)">◀</button>
            <input type="date" id="data-escala">
            <button onclick="mudarDia(1)">▶</button>
        </div>
        <div class="user-info">
            <span id="user-name">Carregando...</span>
            <button onclick="logout()" class="btn-logout">Sair</button>
        </div>
    </header>

    <div class="main-container">
        
        <aside class="sidebar">
            <h3>👥 Banco de Talentos</h3>
            <div class="search-box">
                <input type="text" placeholder="Buscar funcionário..." onkeyup="filtrarFuncionarios(this.value)">
            </div>
            <div id="lista-disponiveis" class="employee-list">
                <div class="loading">Carregando equipe...</div>
            </div>
        </aside>

        <main class="board">
            <div id="board-grid" class="board-grid"></div>
        </main>

    </div>

    <div id="modal-editar" class="modal">
        <div class="modal-content">
            <h3>⏰ Ajustar Horário</h3>
            <p id="modal-nome-func">Nome do Funcionário</p>
            <input type="hidden" id="modal-escala-id">
            
            <div class="form-row">
                <div class="input-group">
                    <label>Entrada</label>
                    <input type="time" id="modal-entrada">
                </div>
                <div class="input-group">
                    <label>Saída</label>
                    <input type="time" id="modal-saida">
                </div>
            </div>

            <div class="form-row">
                <div class="input-group">
                    <label>Início Intervalo</label>
                    <input type="time" id="modal-int-ini">
                </div>
                <div class="input-group">
                    <label>Fim Intervalo</label>
                    <input type="time" id="modal-int-fim">
                </div>
            </div>

            <div class="modal-actions">
                <button class="btn-danger" onclick="removerDaEscala()">🗑️ Remover</button>
                <div class="right-actions">
                    <button class="btn-secondary" onclick="fecharModal()">Cancelar</button>
                    <button class="btn-primary" onclick="salvarHorario()">💾 Salvar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/admin_escala.js"></script>
</body>
</html>
