<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Administrativo</title>
    <link rel="stylesheet" href="/static/css/estilo.css">
    <style>
        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
        }
        .login-card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-card h2 { color: #333; margin-bottom: 1.5rem; }
        .input-group { margin-bottom: 1rem; text-align: left; }
        .input-group label { display: block; margin-bottom: 0.5rem; color: #666; font-size: 0.9rem; }
        .input-group input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box; /* Garante que padding não estoure a largura */
        }
        .btn-login {
            width: 100%;
            padding: 0.8rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-login:hover { background-color: #0056b3; }
        .erro-msg { color: #dc3545; margin-top: 1rem; display: none; font-size: 0.9rem;}
    </style>
</head>
<body>
    <div class="login-card">
        <h2>🔐 Acesso Restrito</h2>
        <div class="input-group">
            <label>Usuário</label>
            <input type="text" id="usuario" placeholder="Digite seu usuário">
        </div>
        <div class="input-group">
            <label>Senha</label>
            <input type="password" id="senha" placeholder="Digite sua senha">
        </div>
        <button class="btn-login" onclick="fazerLogin()">Entrar no Sistema</button>
        <div id="msg-erro" class="erro-msg">Usuário ou senha incorretos.</div>
    </div>

    <script>
        async function fazerLogin() {
            const usuario = document.getElementById('usuario').value;
            const senha = document.getElementById('senha').value;
            const msgErro = document.getElementById('msg-erro');
            const btn = document.querySelector('.btn-login');

            if(!usuario || !senha) {
                msgErro.textContent = "Preencha todos os campos.";
                msgErro.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = "Verificando...";
            msgErro.style.display = 'none';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, senha })
                });

                const data = await response.json();

                if (response.ok && data.sucesso) {
                    // Login com sucesso, redireciona para onde quiser (ex: painel)
                    window.location.href = '/'; 
                } else {
                    msgErro.textContent = data.erro || "Erro ao entrar.";
                    msgErro.style.display = 'block';
                }
            } catch (error) {
                console.error(error);
                msgErro.textContent = "Erro de conexão com o servidor.";
                msgErro.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = "Entrar no Sistema";
            }
        }
        
        // Permitir Enter para logar
        document.getElementById('senha').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') fazerLogin();
        });
    </script>
</body>
</html>
