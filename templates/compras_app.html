<script>
'use strict';
/* =============================================================================
   APP DE COMPRAS - Gela Boca
   Tudo que a pessoa faz fica salvo no celular (localStorage) e é enviado ao
   servidor quando há internet. Assim dá para contar e marcar o carrinho mesmo
   sem sinal no mercado.
   ============================================================================= */

// ---------------------------------------------------------------- utilidades
const CHAVE = 'gb_compras_v1';
const VERSAO_APP = '26';   // aparece no rodapé do início: confira se o celular pegou a versão nova
const $app = document.getElementById('app');
const DIAS_SEMANA = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];            // 1=Dom ... 7=Sáb (padrão do sistema)
const FRACIONADAS = ['KG', 'G', 'GR', 'L', 'LT', 'ML', 'M'];
const PRECO_ANTIGO_DIAS = 30;

function esc(t) {
  return String(t == null ? '' : t).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
}
function num(v) { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : null; }
function fmtQtd(n) {
  if (n == null || !isFinite(n)) return '—';
  return Number(n).toLocaleString('pt-BR', {maximumFractionDigits: 3});
}
function fmtReais(n) { return (n == null) ? '—' : Number(n).toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'}); }
function hojeISO() { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
function dataBR(iso) { if (!iso) return ''; const [a, m, d] = iso.slice(0, 10).split('-'); return `${d}/${m}`; }
function diasDesde(iso) {
  if (!iso) return null;
  const a = new Date(iso.slice(0, 10) + 'T12:00:00'), b = new Date(hojeISO() + 'T12:00:00');
  return Math.round((b - a) / 86400000);
}
function somarDias(n) { const d = new Date(hojeISO() + 'T12:00:00'); d.setDate(d.getDate() + n); return d; }
function diaSemanaSistema(d) { return d.getDay() + 1; }
function novoCodigo() {
  const r = (window.crypto && crypto.getRandomValues) ? Array.from(crypto.getRandomValues(new Uint8Array(8)), b => b.toString(16).padStart(2, '0')).join('')
                                                     : Math.random().toString(16).slice(2, 18);
  return 'L' + Date.now().toString(36) + '-' + r;
}
function ehFracionada(un) { return FRACIONADAS.includes(String(un || '').trim().toUpperCase()); }
function textoQtd(qtd, item) {
  if (!qtd) return '0';
  const f = item.fator || 1;
  if (f > 1 && Math.abs(qtd / f - Math.round(qtd / f)) < 1e-6) {
    const cx = Math.round(qtd / f);
    return `${cx} cx (${fmtQtd(qtd)} ${esc(item.unidade)})`;
  }
  return `${fmtQtd(qtd)} ${esc(item.unidade)}`;
}

const ICONES = {

  seta: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>',

  carrinho: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M3 4h2l2.4 11.2a1.5 1.5 0 0 0 1.5 1.2h8.6a1.5 1.5 0 0 0 1.5-1.2L21 8H6.2"/></svg>',
  casa: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/></svg>',
  listas: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11"/><path d="M9 12h11"/><path d="M9 18h11"/><path d="M4 6h.01"/><path d="M4 12h.01"/><path d="M4 18h.01"/></svg>',
  grafico: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/></svg>',
  menos: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14"/></svg>',
  mais: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>',
  busca: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  semNet: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l20 20"/><path d="M8.5 16.5a5 5 0 0 1 7 0"/><path d="M5 12.9a10 10 0 0 1 5.2-2.8"/><path d="M12 20h.01"/></svg>',
  cima: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>',
  baixo: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',

  enviar: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>',
  caixa: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/></svg>',
  barras: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 5v14"/><path d="M7 5v14"/><path d="M10 5v14"/><path d="M14 5v14"/><path d="M17 5v14"/><path d="M21 5v14"/></svg>',
  qr: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3z"/><path d="M20 14v7h-6"/></svg>',
  camera: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h3l2-3h6l2 3h3a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="4"/></svg>',
  sair: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>',
};

// ---------------------------------------------------------------- dados salvos no celular
let E = carregar();
function carregar() {
  try { const t = localStorage.getItem(CHAVE); if (t) return Object.assign(estadoVazio(), JSON.parse(t)); } catch (e) {}
  return estadoVazio();
}
function estadoVazio() { return {usuario: null, rotinas: [], preparos: {}, ida: null, listas: {}, fila: [], erros: [], cupons: [], codigos: {}, codigosEm: null,
                               recebimentos: null, notasReceb: {}, receb: {}, orcamentos: null}; }
function salvar() {
  try { localStorage.setItem(CHAVE, JSON.stringify(E)); }
  catch (e) { toast('Memória do celular cheia: não deu para salvar.'); }
}

// tela atual (não fica salva)
let T = {nome: 'inicio', p: {}};
let online = navigator.onLine;

// ---------------------------------------------------------------- conversa com o servidor
class ErroApi extends Error { constructor(msg, status, extra) { super(msg); this.status = status; this.extra = extra || {}; } }
async function api(metodo, url, corpo) {
  let r;
  try {
    r = await fetch(url, {method: metodo, credentials: 'same-origin', cache: 'no-store',
      headers: corpo ? {'Content-Type': 'application/json'} : {}, body: corpo ? JSON.stringify(corpo) : undefined});
  } catch (e) {
    marcarOnline(false);
    throw new ErroApi('Sem internet', 0, {offline: true});
  }
  marcarOnline(true);
  let dados = null;
  try { dados = await r.json(); } catch (e) {}
  if (!r.ok) {
    if (r.status === 401 && dados && dados.login) { E.usuario = null; salvar(); }
    // 502/503/504 = o túnel não achou o computador da loja: tratamos como "sem conexão"
    if ([502, 503, 504].includes(r.status) && !(dados && dados.erro)) throw new ErroApi('Servidor da loja fora do ar', 0, {offline: true});
    throw new ErroApi((dados && (dados.erro || dados.mensagem)) || `Erro ${r.status}`, r.status, dados || {});
  }
  return dados;
}
function marcarOnline(v) {
  if (online !== v) { online = v; if (v) sincronizar(); atualizarFaixaRede(); }
}

// fila de envios: o que foi feito sem internet espera aqui
function enfileirar(tarefa) {
  // mudanças no mesmo item da mesma lista: só a última importa
  if (tarefa.tipo === 'itens') {
    const ult = E.fila[E.fila.length - 1];
    const pend = ult && ult.tipo === 'itens' && ult.codigo === tarefa.codigo && !ult.enviando ? ult : null;
    if (pend) {
      tarefa.corpo.itens.forEach(novo => {
        const i = pend.corpo.itens.findIndex(x => x.produto_id === novo.produto_id);
        if (i >= 0) pend.corpo.itens[i] = Object.assign(pend.corpo.itens[i], novo); else pend.corpo.itens.push(novo);
      });
      salvar(); sincronizar(); return;
    }
  }
  E.fila.push(tarefa); salvar(); sincronizar();
}
let sincronizando = false;
async function sincronizar() {
  if (sincronizando || !E.usuario) return;
  sincronizando = true;
  let mudou = false;
  try {
    while (E.fila.length) {
      const t = E.fila[0];
      t.enviando = true;
      try {
        const resp = await api(t.metodo, t.url, t.corpo);
        E.fila.shift(); mudou = true;
        if (resp && resp.codigo && resp.itens) guardarLista(resp, true);
        if (resp && resp.chave && resp.itens && 'emitente' in resp) { guardarCupom(resp); if (!resp.ja_existia) toast('Cupom enviado: ' + (resp.emitente || 'cupom fiscal')); }
        if (t.tipo === 'recebimento' && E.receb[t.chave]) {
          E.receb[t.chave].enviado = true;
          if (resp && resp.itens) E.notasReceb[t.chave] = resp;
          const l = (resp && resp.lancamento) || {};
          toast(`Conferência enviada: NF ${resp.numero || ''}` + (l.ok ? (l.ja_estava ? '' : ' · lançada no estoque ✅') : ' · ainda não entrou no estoque'));
        }
      } catch (e) {
        t.enviando = false;
        if (e.extra.offline || e.status === 401 || e.status === 429 || e.status >= 500) break;   // tenta de novo depois
        E.fila.shift(); mudou = true;                                                          // recusado: avisa e segue
        E.erros.push({quando: new Date().toISOString(), msg: `${t.descricao || 'Envio'}: ${e.message}`});
        toast(`Não foi enviado: ${e.message}`);
        const loc = t.codigo && E.listas[t.codigo];
        if (t.tipo === 'recebimento' && E.receb[t.chave]) E.receb[t.chave].finalizada = false;   // recusada: a nota volta a ficar aberta (não fica "Enviando…" para sempre)
        if (t.tipo === 'lista' && loc && loc.local) { loc.status = 'cancelada'; loc.local_status = null; }   // o servidor não aceitou: não fica "aberta" para sempre
        else if (t.codigo) atualizarLista(t.codigo, true);
      }
      salvar();
    }
  } finally {
    sincronizando = false;
    salvar();
    if (mudou) redesenharSePreciso();
    atualizarFaixaRede();
  }
}
function guardarLista(lista, doServidor) {
  if (lista.status === 'contagem') return;          // [CONTAGEM GERAL] não é lista de compra
  const antiga = E.listas[lista.codigo];
  // se ainda há marcações do carrinho esperando envio, mantém o que a pessoa marcou
  const pend = E.fila.filter(t => t.tipo === 'itens' && t.codigo === lista.codigo);
  pend.forEach(t => t.corpo.itens.forEach(m => {
    const it = lista.itens.find(i => i.produto_id === m.produto_id);
    if (it && 'situacao' in m) it.situacao = m.situacao;
    if (it && 'qtd_pedido' in m) it.qtd_pedido = num(m.qtd_pedido) || 0;
  }));
  if (antiga && antiga.local_status && E.fila.some(t => t.codigo === lista.codigo && t.tipo === 'status')) lista.status = antiga.local_status;
  lista.local = !doServidor;
  lista.atualizado = new Date().toISOString();
  E.listas[lista.codigo] = lista;
  limparListasAntigas();
}
function limparListasAntigas() {
  const cods = Object.keys(E.listas);
  if (cods.length <= 25) return;
  cods.sort((a, b) => (E.listas[a].criada_em || '').localeCompare(E.listas[b].criada_em || ''));
  for (const c of cods.slice(0, cods.length - 25)) {
    if (!E.fila.some(t => t.codigo === c) && ['finalizada', 'cancelada'].includes(E.listas[c].status)) delete E.listas[c];
  }
}
async function atualizarLista(codigo, silencioso) {
  try { guardarLista(await api('GET', `/api/compras/listas/${encodeURIComponent(codigo)}`), true); salvar(); redesenharSePreciso(); }
  catch (e) { if (!silencioso && !e.extra.offline) toast(e.message); }
}
function redesenharSePreciso() {
  // não redesenha a contagem (perderia o que a pessoa está digitando)
  if (T.nome === 'contagem') redesenharContagem(); else desenhar();
}
window.addEventListener('online', () => { online = true; sincronizar(); atualizarFaixaRede(); });
window.addEventListener('offline', () => { online = false; atualizarFaixaRede(); });
setInterval(() => { if (E.fila.length) sincronizar(); }, 20000);

// ---------------------------------------------------------------- navegação
function ir(nome, p) { document.querySelectorAll('.toast').forEach(t => t.remove()); T = {nome, p: p || {}}; desenhar(); window.scrollTo(0, 0); }
function desenhar() {
  if (!E.usuario && T.nome !== 'login') { T = {nome: 'login', p: {}}; setTimeout(carregarUsuarios, 0); }
  const f = TELAS[T.nome] || TELAS.inicio;
  $app.innerHTML = f(T.p);
  if (TELAS_DEPOIS[T.nome]) TELAS_DEPOIS[T.nome](T.p);
}
function toast(msg) {
  const d = document.createElement('div'); d.className = 'toast'; d.setAttribute('role', 'status'); d.textContent = msg;
  if (T.nome === 'contagem') { d.style.bottom = 'auto'; d.style.top = '76px'; }   // não cobre o teclado
  document.body.appendChild(d); setTimeout(() => d.remove(), 3200);
}
function faixaRede() {
  const pend = E.fila.length;
  if (!online) return `<div class="faixa" id="faixa-rede">${ICONES.semNet} Sem internet · tudo fica salvo e envia depois${pend ? ` (${pend} pendente${pend > 1 ? 's' : ''})` : ''}</div>`;
  if (pend) return `<div class="faixa" id="faixa-rede">Enviando ${pend} alteraç${pend > 1 ? 'ões' : 'ão'}…</div>`;
  return '<div id="faixa-rede"></div>';
}
function atualizarFaixaRede() {
  const el = document.getElementById('faixa-rede');
  if (el) el.outerHTML = faixaRede();
}
function topo(titulo, sub, voltar, extra) {
  return `<div class="topo">
    ${voltar ? `<button class="icone-btn" data-acao="${voltar}" aria-label="Voltar">${ICONES.voltar}</button>` : ''}
    <div class="grow"><h1>${esc(titulo)}</h1>${sub ? `<div class="sub">${esc(sub)}</div>` : ''}</div>${extra || ''}</div>`;
}
function navbar(ativa) {
  const b = (id, ic, txt) => `<button class="${ativa === id ? 'ativo' : ''}" data-acao="nav" data-tela="${id}" ${ativa === id ? 'aria-current="page"' : ''}>${ic}${txt}</button>`;
  // [PAINEL DO GESTOR] relatórios só para o gestor: o operacional vê Início e Listas
  const gestor = E.usuario && E.usuario.gestor;
  const gestao = gestor ? b('orcamentos', ICONES.orcamento, 'Orçamentos') + b('gestao', ICONES.grafico, 'Gestão') : '';
  return `<nav class="navbar">${b('inicio', ICONES.casa, 'Início')}${b('listas', ICONES.listas, 'Listas')}${b('receber', ICONES.caixa, 'Receber')}${gestao}</nav>`;
}
function abrirModal(html) {
  fecharModal();
  pararLeitorQr();
  const fundo = document.createElement('div'); fundo.className = 'modal-fundo'; fundo.id = 'modal';
  fundo.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  fundo.addEventListener('click', e => { if (e.target === fundo) fecharModal(); });
  document.body.appendChild(fundo);
  const foco = fundo.querySelector('input'); if (foco) setTimeout(() => foco.focus(), 50);
}
function fecharModal() {
  const m = document.getElementById('modal');
  if (m) m.remove();
}

// ---------------------------------------------------------------- cálculo da lista (igual ao servidor)
function escolherFornecedor(precos, permitidos) {
  if (!precos || !precos.length) return [null, null];
  let cand = precos.filter(p => !permitidos.length || permitidos.includes(p.fornecedor_id));
  let aviso = null;
  if (!cand.length) { cand = precos.slice(); aviso = 'Nunca comprado nos fornecedores desta rotina'; }
  cand.sort((a, b) => (a.custo - b.custo) || (b.data || '').localeCompare(a.data || ''));
  return [cand[0], aviso];
}
function arredondar(sug, unidade, fator) {
  if (sug <= 0) return 0;
  if (fator > 1) return Math.ceil(sug / fator - 1e-9) * fator;
  if (ehFracionada(unidade)) return Math.round(sug * 1000) / 1000;
  return Math.ceil(sug - 1e-9);
}
function calcularListaLocal(preparo, ida) {
  const itens = preparo.itens.map(it => {
    const contado = ida.contagens[it.produto_id];
    const alertas = [];
    let estoque;
    if (contado != null) estoque = contado;
    else if (it.estoque_estimado != null) { estoque = it.estoque_estimado; alertas.push('Não contado agora: usado o estoque estimado'); }
    else { estoque = 0; alertas.push('Sem contagem: estoque considerado zero'); }
    if (it.alerta) alertas.push(it.alerta);
    const [preco, aviso] = escolherFornecedor(it.precos, preparo.fornecedores || []);
    if (aviso) alertas.push(aviso);
    const sug = Math.max((it.consumo_dia || 0) * ((preparo.prazo_dias || 0) + ida.dias) + (it.estoque_minimo || 0) - estoque, 0);
    const fator = preco && preco.fator > 1 ? preco.fator : 1;
    const qtd = arredondar(sug, it.unidade, fator);
    return {produto_id: it.produto_id, ordem: it.ordem, secao: it.secao, nome: it.nome, unidade: it.unidade,
            qtd_contada: contado == null ? null : contado, estoque, consumo_dia: it.consumo_dia, estoque_minimo: it.estoque_minimo,
            qtd_sugerida: sug, qtd_pedido: qtd, fator, caixas: fator > 1 ? qtd / fator : null,
            fornecedor_id: preco ? preco.fornecedor_id : null, fornecedor: preco ? preco.fornecedor : null,
            custo: preco ? preco.custo : null, data_preco: preco ? preco.data : null, situacao: '', alerta: alertas.join(' · ') || null};
  });
  const valor = itens.reduce((s, i) => s + (i.custo && i.qtd_pedido ? i.custo * i.qtd_pedido : 0), 0);
  return {codigo: ida.codigo, rotina_id: preparo.id, rotina: preparo.nome, funcionario: E.usuario.nome, funcionario_id: E.usuario.id,
          criada_em: new Date().toISOString(), dias_cobertura: ida.dias, prazo_dias: preparo.prazo_dias,
          status: E.usuario.gestor ? 'aprovada' : 'aguardando', valor_estimado: Math.round(valor * 100) / 100, itens,
          qtd_contados: itens.filter(i => i.qtd_contada != null).length, qtd_comprar: itens.filter(i => i.qtd_pedido > 0).length};
}

// ================================================================= TELAS
const TELAS = {}, TELAS_DEPOIS = {};

// ---------------------------------------------------------------- login com PIN
TELAS.login = p => {
  if (p.usuario) {
    const pontos = [0, 1, 2, 3].map(i => `<span class="${i < (p.pin || '').length ? 'on' : ''}"></span>`).join('');

async function carregarInicio() {

    if (E.usuario && E.usuario.gestor) carregarOrcamentos().then(() => { if (T.nome === 'inicio') desenhar(); });
  }
  try { E.rotinas = await api('GET', '/api/compras/rotinas'); salvar(); }
  catch (e) { if (e.status === 401) return desenhar(); }
  try {
    const listas = await api('GET', '/api/compras/listas');
    // a tela inicial mostra as abertas; os detalhes são buscados ao abrir
    for (const l of listas) {
      const atual = E.listas[l.codigo];
      if (!atual) { E.listas[l.codigo] = Object.assign({itens: null}, l); continue; }
      if (!atual.local) Object.assign(atual, {status: l.status, qtd_comprar: l.qtd_comprar, qtd_marcados: l.qtd_marcados, valor_estimado: l.valor_estimado});
    }
    // lista aberta no celular que não veio do servidor (ex.: cancelada por outro celular há muito tempo)
    const vieram = new Set(listas.map(l => l.codigo));
    const sumidas = Object.values(E.listas).filter(l => !l.local && !vieram.has(l.codigo) && ['aguardando', 'aprovada'].includes(l.status)
                                                    && !E.fila.some(t => t.codigo === l.codigo)).slice(0, 5);
    for (const l of sumidas) {
      try { guardarLista(await api('GET', `/api/compras/listas/${encodeURIComponent(l.codigo)}`), true); }
      catch (e) { if (e.status === 400 || e.status === 404) delete E.listas[l.codigo]; }
    }
    salvar();
  } catch (e) {}
  if (T.nome === 'inicio') desenhar();
}

async function comecarIda(rotinaId, dias) {
  T.p.carregando = true; desenhar();
  let prep = null;
  try { prep = await api('GET', `/api/compras/rotinas/${rotinaId}/preparar`); E.preparos[rotinaId] = prep; salvar(); }
  catch (e) {
    if (!e.extra.offline) { T.p.carregando = false; desenhar(); return toast(e.message); }
    prep = E.preparos[rotinaId];
    if (!prep) { T.p.carregando = false; desenhar(); return toast('Sem internet e esta rotina ainda não foi baixada neste celular.'); }
    toast('Sem internet: usando os dados salvos de ' + dataBR(prep.gerado_em));
  }
  if (!prep.itens.length) { T.p.carregando = false; desenhar(); return toast('Esta rotina não tem itens.'); }
  // [CONTAGEM GERAL] com mais de um local: primeiro escolhe quais locais esta pessoa conta
  T.p.rotina_id = rotinaId;
  const secoes = [...new Set(prep.itens.flatMap(i => locaisDoItem(i).map(nomeLocal)))];
  if (prep.so_contagem && secoes.length > 1 && !T.p.secoes) {
    T.p.secoes = secoes; T.p.selLocais = []; T.p.itensSel = prep.itens.reduce((n, i) => n + locaisDoItem(i).length, 0); T.p.carregando = false; return desenhar();
  }
  const sel = prep.so_contagem && T.p.selLocais && T.p.selLocais.length ? T.p.selLocais.slice() : null;
  E.ida = {codigo: novoCodigo(), rotina_id: rotinaId, dias: prep.so_contagem ? (prep.dias_cobertura || 7) : dias, idx: 0, contagens: {}, porLocal: {}, modo: {}, cx: {},
           extras: [], iniciada: new Date().toISOString(), dia: hojeISO(), usuario_id: E.usuario.id, usuario_nome: E.usuario.nome, secoes: sel};
  salvar();
  carregarCodigos();
  ir('contagem');
}

// ---------------------------------------------------------------- contagem em LISTA com teclado fixo
// Todos os itens numa tela só. O item da vez fica em verde; o número é digitado no
// teclado grande de baixo (não abre o teclado do celular) e "OK" pula para o próximo.
// [CONTAGEM 2] linhas = produto x local. O mesmo produto pode estar em vários locais: cada local
// tem o seu número e o estoque recebe a SOMA. "+ Somar" junta mais um tanto no mesmo local.
const LOCAL_FORA = 'Bipados fora da rotina';
function locaisDoItem(it) { return it.locais && it.locais.length ? it.locais : [it.secao || '']; }
function nomeLocal(l) { return l || 'Sem local'; }
function normalizarIda() {
  // contagem começada na versão antiga (um número por produto): passa para o formato por local
  const ida = E.ida;
  if (!ida || ida.porLocal) return;
  ida.porLocal = {};
  const prep = E.preparos[ida.rotina_id];
  const todos = prep ? prep.itens.concat(ida.extras || []) : (ida.extras || []);
  Object.keys(ida.contagens || {}).forEach(pid => {
    const it = todos.find(i => String(i.produto_id) === String(pid));
    ida.porLocal[pid] = {[it ? locaisDoItem(it)[0] : '']: ida.contagens[pid]};
  });
}
function linhasIda() {
  normalizarIda();
  const prep = E.preparos[E.ida.rotina_id], sel = E.ida.secoes;
  const todos = prep.itens.concat(E.ida.extras || []);
  const ordem = [];
  todos.forEach(it => locaisDoItem(it).forEach(l => { if (!ordem.includes(l)) ordem.push(l); }));
  const linhas = [];
  ordem.forEach(l => {
    if (sel && sel.length && !sel.includes(nomeLocal(l)) && l !== LOCAL_FORA) return;
    todos.forEach(it => { if (locaisDoItem(it).includes(l)) linhas.push({it, local: l, k: linhas.length}); });
  });
  return linhas;
}
function itensIda() {
  // produtos (sem repetir) das linhas desta contagem
  const vistos = new Set();
  return linhasIda().map(l => l.it).filter(it => !vistos.has(it.produto_id) && vistos.add(it.produto_id));
}
function valorLinha(l) { const m = E.ida.porLocal[l.it.produto_id]; return m && m[l.local] != null ? m[l.local] : null; }
function totalProduto(pid) {
  const m = E.ida.porLocal[pid] || {}, vs = Object.values(m).filter(v => v != null);
  return vs.length ? Math.round(vs.reduce((a, b) => a + b, 0) * 1000) / 1000 : null;
}
function gravarLinha(l, v) {
  const pid = l.it.produto_id;
  E.ida.porLocal[pid] = E.ida.porLocal[pid] || {};
  if (v == null) delete E.ida.porLocal[pid][l.local]; else E.ida.porLocal[pid][l.local] = Math.round(v * 1000) / 1000;
  const t = totalProduto(pid);
  if (t == null) delete E.ida.contagens[pid]; else E.ida.contagens[pid] = t;
  salvar();
}
function linhaAtual() { const ls = linhasIda(); return ls[Math.min(Math.max(E.ida.idx || 0, 0), ls.length - 1)]; }
function itemAtual() { return linhaAtual().it; }
function caixaDe(it) { return (E.ida.cx && E.ida.cx[it.produto_id]) || (it.caixas || [])[0] || null; }
function fatorAtual(it) { const cx = caixaDe(it); return cx && E.ida.modo[it.produto_id] === 'cx' ? cx : 1; }
function unCurta(un) { const u = String(un || 'UN').toUpperCase(); return ['UN', 'UND', 'UNID'].includes(u) ? 'un' : u.toLowerCase(); }
function outroContouHoje(l) {
  const h = l.it.hoje_locais && l.it.hoje_locais[l.local];
  return h && h.por !== E.usuario.nome ? h : null;
}
// [CONTAGEM CEGA] quem conta não vê o número anterior nem o esperado (para não ser influenciado). Só o gestor vê.
function contagemCega() { return !(E.usuario && E.usuario.gestor); }

async function terminarContagem() {

  const corpo = {codigo: ida.codigo, rotina_id: ida.rotina_id, dias: ida.dias,
                 itens: itensParaEnviar(prep.itens)
                   .concat(itensParaEnviar((ida.extras || []).filter(it => totalProduto(it.produto_id) != null)).map(x => Object.assign(x, {extra: true})))};
  if (ida.dia && ida.dia !== hojeISO() && Object.keys(ida.contagens).length &&

    guardarLista(lista, true);

    if (!e.extra.offline) { fecharModal(); return toast(e.message); }

    toast('Sem internet: lista calculada no celular. Será enviada quando conectar.');
  }
  E.ida = null; salvar(); fecharModal();
  ir('lista', {codigo: corpo.codigo});

async function terminarContagemGeral() {

                 itens: itensParaEnviar(contados).map((x, i) => Object.assign(x, {extra: !prep.itens.includes(contados[i]) || undefined}))};

}

function normalizarTexto(t) { return String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
function podeMexer(l) { return l.status === 'aprovada' || (l.status === 'aguardando' && E.usuario.gestor); }
function ehAprendendo(i) { return /Consumo aproximado|Nunca contado|Sem histórico/.test(i.alerta || ''); }
function alertaCurto(i) {
  return (i.alerta || '').split(' · ').filter(a => a && !/Consumo aproximado|Nunca contado|Sem histórico/.test(a)).map(a =>
    /^Não contado agora/.test(a) ? 'não contado agora' : /^Sem contagem/.test(a) ? 'sem contagem' : /^Conferir/.test(a) ? '⚠ conferir consumo'
    : /^Nunca comprado nos fornecedores/.test(a) ? 'fornecedor fora da rotina' : /^Incluído na mão por/.test(a) ? a.replace('Incluído na mão por', 'incluído por') : a).join(' · ');
}
function passoDe(i) { return i.fator > 1 ? i.fator : 1; }
function nomeCurto(nome) {
  if (!nome) return 'Sem preço registrado';
  const n = normalizarTexto(nome);
  const marcas = [['sendas', 'Assaí'], ['assai', 'Assaí'], ['atacadao', 'Atacadão'], ['comper', 'Comper'], ['fort atacad', 'Fort Atacadista'],
                  ['big lar', 'Big Lar'], ['carrefour', 'Carrefour'], ['makro', 'Makro'], ['tenda', 'Tenda']];
  for (const [chave, curto] of marcas) if (n.includes(chave)) return curto;
  let t = ' ' + String(nome).toUpperCase().replace(/[.,]/g, ' ') + ' ';
  const tirar = ['INDUSTRIAL E COMERCIAL', 'INDUSTRIA E COMERCIO', 'COMERCIO E INDUSTRIA', 'COMERCIO DE', 'COMERCIO', 'INDUSTRIA', 'DISTRIBUIDORA DE',
                 'DISTRIBUIDORA', 'DISTRIBUICAO', 'ATACADISTA', 'ALIMENTOS', 'ALIMENTICIOS', 'PRODUTOS', 'SOBREMESAS', 'EIRELI', 'LTDA', 'EPP', ' ME ',
                 ' S/A', ' SA ', ' S A ', ' DE ', ' DO ', ' DA ', ' E ', ' LJ\\d+'];
  for (const x of tirar) t = t.replace(new RegExp(x.replace('/', '\\/'), 'g'), ' ');
  const palavras = t.trim().split(/\s+/).filter(w => w.length > 1 && !/^LJ\d+$/.test(w));
  const curto = palavras.slice(0, 2).join(' ') || String(nome);
  return curto.toLowerCase().replace(/(^|\s)(\S)/g, (m, e, l) => e + l.toUpperCase());
}
function agruparPorFornecedor(itens) {
  const mapa = new Map();
  for (const i of itens) {
    const chave = nomeCurto(i.fornecedor);
    if (!mapa.has(chave)) mapa.set(chave, {nome: chave, itens: [], valor: 0, feitos: 0});
    const g = mapa.get(chave); g.itens.push(i); if (i.custo) g.valor += i.custo * (i.qtd_pedido || 0); if (i.situacao) g.feitos++;
  }
  return [...mapa.values()].sort((a, b) => (a.nome === 'Sem preço registrado') - (b.nome === 'Sem preço registrado') || b.itens.length - a.itens.length);
}
function qtdHTML(i) {

  return `${fmtQtd(q)}<small>${esc(unCurta(i.unidade))}</small>`;
}

function precoLocal(l, pid) {
  // preço/caixa do item a partir dos dados da contagem salvos no celular (quando houver)
  const prep = E.preparos[l.rotina_id];
  const it = prep && prep.itens.find(x => x.produto_id === pid);
  if (!it || !it.precos || !it.precos.length) return null;
  const [pr] = escolherFornecedor(it.precos, prep.fornecedores || []);
  return pr;
}
function incluirNaLista(codigo, prod, qtd) {
  const l = E.listas[codigo];
  let it = l.itens.find(i => i.produto_id === prod.produto_id);
  if (it) {
    const nova = Math.max(it.qtd_pedido || 0, qtd || passoDe(it));
    mudarItensLista(codigo, [{produto_id: it.produto_id, qtd_pedido: nova}], 'Quantidade');
  } else {
    const pr = precoLocal(l, prod.produto_id);
    const fator = pr && pr.fator > 1 ? pr.fator : 1;
    it = {produto_id: prod.produto_id, nome: prod.nome, unidade: prod.unidade || 'UN', ordem: 99999, secao: 'Incluídos na mão',
          qtd_contada: null, estoque: null, consumo_dia: null, estoque_minimo: null, qtd_sugerida: 0, qtd_pedido: qtd || fator,
          fator, caixas: null, fornecedor_id: pr ? pr.fornecedor_id : null, fornecedor: pr ? pr.fornecedor : null,
          custo: pr ? pr.custo : null, data_preco: pr ? pr.data : null, situacao: '', alerta: 'Incluído na mão por ' + E.usuario.nome};
    l.itens.push(it);
    l.valor_estimado = Math.round(l.itens.reduce((s, i) => s + (i.custo && i.qtd_pedido ? i.custo * i.qtd_pedido : 0), 0) * 100) / 100;
    enfileirar({tipo: 'adicionar', codigo, metodo: 'POST', url: `/api/compras/listas/${encodeURIComponent(codigo)}/adicionar`,
                corpo: {produto_id: prod.produto_id, qtd: it.qtd_pedido}, descricao: 'Incluir ' + prod.nome});
  }
  T.p.piscar = prod.produto_id;
  if (T.p.vistos && !T.p.vistos.includes(prod.produto_id)) T.p.vistos.push(prod.produto_id);
  salvar(); desenhar();
  const el = document.getElementById((T.nome === 'carrinho' ? 'car-' : 'li-') + prod.produto_id);
  if (el) el.scrollIntoView({block: 'center', behavior: 'smooth'});
  toast('✓ ' + prod.nome + ' na compra');
}
function mudarQtdLista(codigo, pid, sentido) {
  const l = E.listas[codigo], it = l.itens.find(i => i.produto_id === pid);
  if (!it || !podeMexer(l)) return;
  const passo = passoDe(it);
  let nova = Math.round(((it.qtd_pedido || 0) + sentido * passo) * 1000) / 1000;
  if (sentido < 0 && passo > 1) nova = Math.max(0, Math.ceil((it.qtd_pedido || 0) / passo - 1 - 1e-9) * passo);   // volta para caixa inteira
  nova = Math.max(0, nova);
  mudarItensLista(codigo, [{produto_id: pid, qtd_pedido: nova}], 'Quantidade');
  if (navigator.vibrate) navigator.vibrate(8);
  desenhar();
}

// ---------------------------------------------------------------- consumo
function conteudoConsumo(p) {
  const rot = E.rotinas.find(r => r.id === p.rotina_id) || E.rotinas[0];
  if (!rot) return '<div class="vazio">Nenhuma rotina criada.</div>';
  const prep = E.preparos[rot.id];
  const chips = `<div class="filtros">${E.rotinas.map(r => `<button class="filtro ${r.id === rot.id ? 'sel' : ''}" data-acao="consumo-rotina" data-id="${r.id}">${esc(r.nome)}</button>`).join('')}</div>`;
  let corpo = '<div class="vazio">Carregando…</div>';
  if (prep) {
    const itens = prep.itens.map(i => ({...i, dura: i.consumo_dia > 0 && i.estoque_estimado != null ? i.estoque_estimado / i.consumo_dia : null}))
      .sort((a, b) => (a.dura == null) - (b.dura == null) || (a.dura || 0) - (b.dura || 0));
    corpo = `<div class="mini suave">Estimativa de ${dataBR(prep.gerado_em)} pela última contagem e pelas notas importadas.</div>
      <div class="linhas">${itens.map(i => {
        const dura = i.dura == null ? '<span class="suave">sem dados</span>'
          : `<b style="color:${i.dura < 3 ? 'var(--laranja)' : 'var(--verde-esc)'}">${i.dura < 1 ? 'acabando' : '~' + Math.floor(i.dura) + ' dias'}</b>`;
        return `<div class="lin"><div class="grow"><div style="font-weight:700">${esc(i.nome)}</div>
          <div class="mini suave">${i.consumo_dia ? fmtQtd(i.consumo_dia) + ' ' + esc(i.unidade) + '/dia' : 'consumo desconhecido'} · tem ≈ ${i.estoque_estimado == null ? '?' : fmtQtd(Math.round(i.estoque_estimado * 10) / 10)} ${esc(i.unidade)}</div></div>
          <div class="pequeno" style="text-align:right">${dura}</div></div>`;
      }).join('')}</div>`;
  }
  return `<div class="mini suave">Quanto tempo cada item ainda dura</div>${chips}${corpo}`;
}

let esperaOrc = null;
function salvarOrcamento(imediato) {
  const p = T.p;
  if (!p.o) return;
  clearTimeout(esperaOrc);
  const id = p.o.id;
  const enviar = async () => {
    const o = T.nome === 'orcamento' && T.p.id === id ? T.p.o : null;
    if (!o) return;
    try {
      const novo = await api('PUT', `/api/compras/orcamentos/${id}`, {itens: o.itens.map(i => ({produto_id: i.produto_id, qtd: i.qtd, preco: i.preco})), observacao: o.observacao});
      if (T.nome === 'orcamento' && T.p.id === id) { T.p.o = novo; T.p.salvando = false; desenhar(); }
    } catch (e) { toast(e.extra.offline ? 'Sem internet: a mudança NÃO foi salva.' : e.message); if (T.p.id === id) { T.p.salvando = false; abrirOrcamento(id); } }
  };
  p.salvando = true;
  if (imediato) return enviar();
  esperaOrc = setTimeout(enviar, 700);
}
function itemOrc(pid) { return T.p.o.itens.find(i => i.produto_id === +pid); }
function mudarQtdOrc(pid, delta) {
  const i = itemOrc(pid), passo = i.fator > 1 ? i.fator : 1;
  const novo = Math.round((i.qtd + delta * passo) * 1000) / 1000;
  if (novo <= 0) return toast('Para tirar o item, toque na lixeira.');
  i.qtd = novo; salvarOrcamento(); desenhar();
}

function graficoPreco(h) {
  // uma série só (preço pago por unidade do estoque); o título do cartão dá o nome, sem legenda
  const pts = h.compras.filter(c => !c.bonificacao && c.custo > 0).map(c => ({...c, t: new Date(c.data + 'T12:00:00').getTime()}));
  if (!pts.length) return '<div class="mini suave">Nenhuma compra paga no período.</div>';
  const W = 340, H = 170, ml = 52, mr = 12, mt = 12, mb = 26;
  const ts = pts.map(x => x.t), vs = pts.map(x => x.custo);
  let t0 = Math.min(...ts), t1 = Math.max(...ts); if (t1 === t0) { t0 -= 86400000 * 15; t1 += 86400000 * 15; }
  let v0 = Math.min(...vs), v1 = Math.max(...vs); const folga = (v1 - v0) * 0.15 || v1 * 0.1 || 1; v0 = Math.max(0, v0 - folga); v1 += folga;
  const x = t => ml + (t - t0) / (t1 - t0) * (W - ml - mr), y = v => mt + (1 - (v - v0) / (v1 - v0)) * (H - mt - mb);
  const grade = [0, 0.5, 1].map(f => { const v = v0 + (v1 - v0) * f; return `<line x1="${ml}" x2="${W - mr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--linha)" stroke-width="1"/>
      <text x="${ml - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="var(--suave)">${fmtReais(v).replace('R$', '').trim()}</text>`; }).join('');
  const datas = [t0, (t0 + t1) / 2, t1].map((t, i) => `<text x="${x(t)}" y="${H - 8}" text-anchor="${['start', 'middle', 'end'][i]}" font-size="10" fill="var(--suave)">${new Date(t).toLocaleDateString('pt-BR', {day: '2-digit', month: '2-digit', year: '2-digit'})}</text>`).join('');
  const linha = pts.length > 1 ? `<polyline points="${pts.map(q => `${x(q.t).toFixed(1)},${y(q.custo).toFixed(1)}`).join(' ')}" fill="none" stroke="var(--verde)" stroke-width="2" stroke-linejoin="round"/>` : '';
  const dots = pts.map(q => `<g><title>${dataBR(q.data)}/${q.data.slice(2, 4)} · ${esc(nomeCurto(q.fornecedor))} · ${fmtReais(q.custo)}/${esc(unCurta(h.unidade))}${q.nf ? ' · NF ' + esc(q.nf) : ''}</title>
      <circle cx="${x(q.t)}" cy="${y(q.custo)}" r="12" fill="transparent"/><circle cx="${x(q.t)}" cy="${y(q.custo)}" r="4" fill="var(--verde)" stroke="#fff" stroke-width="2"/></g>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Preço pago por ${esc(h.unidade)} ao longo do tempo">${grade}${datas}${linha}${dots}</svg>
    <div class="mini suave">Toque num ponto para ver data, fornecedor e preço.</div>`;
}

let promessaJsQR = null;
function carregarJsQR() {
  if (window.jsQR) return Promise.resolve(window.jsQR);
  if (!promessaJsQR) promessaJsQR = new Promise((ok, erro) => {
    const sc = document.createElement('script'); sc.src = '/compras/arquivos/jsQR.js';
    sc.onload = () => window.jsQR ? ok(window.jsQR) : erro(new Error('jsQR'));
    sc.onerror = () => { promessaJsQR = null; erro(new Error('jsQR')); };

async function detectorNativo() {
  try {
    if (!('BarcodeDetector' in window)) return null;

    return formatos.includes('qr_code') ? new BarcodeDetector({formats: ['qr_code']}) : null;
  } catch (e) { return null; }
}
function qrDoCanvas(jsQR, cv, ctx, fonte, largura, altura, tentativas) {

  const dados = ctx.getImageData(0, 0, largura, altura);
  const r = jsQR(dados.data, largura, altura, {inversionAttempts: tentativas || 'attemptBoth'});
  return r && r.data ? r.data : null;

async function lerQrNoCelular(arquivo) {
  let img;

  const nativo = await detectorNativo();
  if (nativo) { try { const a = await nativo.detect(img); if (a.length) return a[0].rawValue; } catch (e) {} }
  let jsQR;
  try { jsQR = await carregarJsQR(); } catch (e) { return null; }
  const cv = document.createElement('canvas'), ctx = cv.getContext('2d', {willReadFrequently: true});
  const maior = Math.max(img.width, img.height);
  // a foto do celular é enorme e o QR do cupom é pequeno: tenta em vários tamanhos
  for (const alvo of [1000, 1600, 700, 2200, 500]) {
    const esc = Math.min(1, alvo / maior);
    const texto = qrDoCanvas(jsQR, cv, ctx, img, Math.round(img.width * esc), Math.round(img.height * esc));
    if (texto) return texto;

// A câmera do celular foi retirada: o bip é feito pelo leitor Bluetooth (modo teclado/HID),
// que funciona em Android e iPhone, com ou sem internet.
function bipMensagem(t) { T.p.bipMsg = t; }
let _audio = null;
function bipe(ok) {

    _audio = _audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = _audio.createOscillator(), g = _audio.createGain();
    o.frequency.value = ok ? 1850 : 380; g.gain.value = 0.08;
    o.connect(g); g.connect(_audio.destination); o.start(); o.stop(_audio.currentTime + (ok ? 0.09 : 0.25));
  } catch (e) {}

// leitor Bluetooth/USB: digita muito rápido e termina com Enter
// ---- LEITOR BLUETOOTH (modo teclado / HID) ----
// O leitor "digita" o código muito rápido (vários números em poucos milésimos) e,
// na maioria dos modelos, aperta Enter no fim. Alguns apertam Tab, outros nada:
// por isso também aceita o código quando os números param de chegar.
// Uma pessoa digitando é bem mais lenta: o app não confunde com o leitor.
const LEITOR = {buf: '', ultimo: 0, timer: null, intervalos: [], campo: null};
function campoDeTexto(el) {
  // campos onde o leitor pode "digitar" sem querer (nome, busca, seção). Campos de número
  // (dias, prazo, quantidade) ficam de fora: lá a pessoa digita números de propósito.
  return el && el.tagName === 'INPUT' && !['numeric', 'decimal'].includes(el.getAttribute('inputmode') || '') && el.type !== 'file';
}
function leitorEntregar() {
  clearTimeout(LEITOR.timer); LEITOR.timer = null;
  const cod = LEITOR.buf, campo = LEITOR.campo;
  const rapido = LEITOR.intervalos.length >= 6 && Math.max(...LEITOR.intervalos) < 120;
  LEITOR.buf = ''; LEITOR.intervalos = []; LEITOR.campo = null;
  if (cod.length < 8 || cod.length > 14 || !rapido) return false;
  // o leitor escreveu (parte d)o código dentro do campo que estava selecionado: tira de lá.
  // Se a tela foi redesenhada no meio do bip, o campo é outro elemento: acha pelo id.
  const el = campo && (document.body.contains(campo) ? campo : (campo.id && document.getElementById(campo.id)));
  if (el && el.id !== 'leitor-campo') {
    for (let n = cod.length; n > 0; n--) {
      if (el.value.endsWith(cod.slice(0, n))) {
        el.value = el.value.slice(0, -n);
        el.dispatchEvent(new Event('input', {bubbles: true}));
        break;
      }
    }

  if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();

}
document.addEventListener('keydown', e => {
  const alvo = e.target;
  const ehCampo = alvo && (alvo.tagName === 'INPUT' || alvo.tagName === 'TEXTAREA' || alvo.tagName === 'SELECT');
  if (ehCampo && !campoDeTexto(alvo)) return;              // campo de número: não interfere
  const agora = Date.now();
  if (agora - LEITOR.ultimo > 150) { LEITOR.buf = ''; LEITOR.intervalos = []; LEITOR.campo = null; }
  else if (LEITOR.buf) LEITOR.intervalos.push(agora - LEITOR.ultimo);
  LEITOR.ultimo = agora;
  if (e.key === 'Enter' || e.key === 'Tab') {
    if (LEITOR.buf.length >= 8 && LEITOR.buf.length <= 14 && LEITOR.intervalos.length >= 6 && Math.max(...LEITOR.intervalos) < 120) {
      e.preventDefault(); e.stopPropagation(); leitorEntregar();
    }
    return;
  }
  if (/^\d$/.test(e.key)) {
    LEITOR.buf += e.key;
    if (ehCampo) LEITOR.campo = alvo;                           // guarda o 1º campo que recebeu números
    if (!ehCampo && LEITOR.buf.length >= 8) e.preventDefault();   // não deixa os números "apertarem" botões
    clearTimeout(LEITOR.timer);
    LEITOR.timer = setTimeout(leitorEntregar, 250);              // leitor que não manda Enter no fim
  } else if (e.key.length === 1) { LEITOR.buf = ''; LEITOR.intervalos = []; }   // letra no meio: não é código
}, true);

  'rot-remover': d => { T.p.r.itens.splice(+d.k, 1); desenhar(); },
  'rot-adicionar': () => modalBuscaProduto(),
  'rot-todos': async () => {   // [CONTAGEM GERAL] o catálogo inteiro; o local começa como a categoria (dá para trocar)
    let todos;
    try { todos = await api('GET', '/api/compras/produtos?todos=1'); }
    catch (e) { return toast(e.extra.offline ? 'Sem internet.' : e.message); }
    const ja = new Set(T.p.r.itens.map(i => i.produto_id));
    const novos = todos.filter(a => !ja.has(a.produto_id));
    if (!novos.length) return toast('Todos os produtos do estoque já estão na rotina.');
    if (!confirm(`Incluir ${novos.length} produto(s)? O local de cada um começa igual à categoria (troque depois, se quiser).`)) return;
    novos.sort((a, b) => (a.categoria || '').localeCompare(b.categoria || '') || a.nome.localeCompare(b.nome));
    novos.forEach(a => T.p.r.itens.push({produto_id: a.produto_id, nome: a.nome, unidade: a.unidade, secao: a.categoria || ''}));
    desenhar(); toast(`${novos.length} produto(s) incluído(s). Toque em Salvar.`);
  },
  'rot-incluir': (d, el) => {
    const secao = (document.getElementById('busca-secao') || {}).value || '';
    T.p.ultimaSecao = secao.trim();
    T.p.r.itens.push({produto_id: +d.pid, nome: d.nome, unidade: d.un, secao: T.p.ultimaSecao});
    el.outerHTML = '<span class="pilula p-verde">incluído</span>';
  },
  'rot-salvar': async () => {
    const r = T.p.r;
    T.p.salvando = true; desenhar();
    try {
      const salvo = await api('POST', '/api/compras/rotinas', {id: r.id, nome: r.nome, dias_semana: r.dias_semana, dias_cobertura: r.dias_cobertura,
        prazo_dias: r.prazo_dias, fornecedores: r.fornecedores, so_contagem: !!r.so_contagem,
        itens: r.itens.map(i => ({produto_id: i.produto_id, secao: i.secao}))});
      toast('Rotina salva.');
      if (!(E.ida && E.ida.rotina_id === salvo.id)) delete E.preparos[salvo.id];   // contagem aberta usa estes dados: não apaga
      E.rotinas = await api('GET', '/api/compras/rotinas'); salvar();
      ir('rotinas', {});
    } catch (e) { T.p.salvando = false; desenhar(); toast(e.extra.offline ? 'Sem internet: rotina não foi salva.' : e.message); }
  },
  'rot-apagar': async () => {
    if (!confirm('Apagar esta rotina? As listas antigas continuam no histórico.')) return;
    try { await api('DELETE', `/api/compras/rotinas/${T.p.r.id}`); E.rotinas = await api('GET', '/api/compras/rotinas'); salvar(); ir('rotinas', {}); }
    catch (e) { toast(e.message); }
  },
  // cupom fiscal
  'cupom-ler': d => modalLerCupom(d.lista),
  'cupom-ao-vivo': d => lerQrAoVivo(texto => { statusCupom('QR Code lido!'); enviarCupom({qr: texto, lista_codigo: d.lista || null}); }),
  'cupom-link': d => {
    const t = document.getElementById('cupom-link').value.trim();
    const numeros = t.replace(/\D/g, '');
    // link (também o que um leitor USB "digita", às vezes com sinais trocados) ou a chave de 44 números
    if (!/^https?/i.test(t) && !/sefaz|nfce/i.test(t) && numeros.length !== 44) {
      return statusCupom(numeros.length && numeros.length < 60 ? `⚠ A chave tem 44 números; você digitou ${numeros.length}.` : '⚠ Cole o link do QR Code ou digite a chave de 44 números.');
    }
    if (numeros.length === 44 && !/[a-z]/i.test(t)) {   // só a chave: a SEFAZ pede "não sou robô" (ver os 3 passos)
      try { navigator.clipboard.writeText(numeros); } catch (e) {}
      const det = document.getElementById('cupom-so-chave'); if (det) det.open = true;
      return statusCupom('Só com a chave a SEFAZ pede "Não sou um robô": siga os 3 passos abaixo (a chave já foi copiada).');
    }
    enviarCupom({qr: t, lista_codigo: d.lista || null});
  },
  'cupom-abrir': async d => {
    ir('cupom', {id: +d.id});
    try { guardarCupom(await api('GET', `/api/compras/cupons/${d.id}`)); if (T.nome === 'cupom') desenhar(); } catch (e) { if (!e.extra.offline) toast(e.message); }
  },
  'cupom-abrir-sefaz': () => {
    const c = document.getElementById('cupom-link'), numeros = c ? c.value.replace(/\D/g, '') : '';
    if (numeros.length === 44) { try { navigator.clipboard.writeText(numeros); } catch (e) {} }
    window.open('https://www.sefaz.mt.gov.br/nfce/consultanfce', '_blank', 'noopener');
    statusCupom(numeros.length === 44 ? 'Chave copiada: cole com Ctrl+V na SEFAZ.' : 'Digite a chave na página da SEFAZ.');
  },
  'cupom-voltar': () => { if (T.p.voltar) ir(T.p.voltar.nome, T.p.voltar.p); else acoes.nav(E.usuario.gestor ? {tela: 'gestao', secao: 'cupons'} : {tela: 'listas'}); },
  'cupom-item': d => modalItemCupom(d.seq),
  'cupom-escolher': d => {
    T.p.sel = {produto_id: +d.pid, nome: d.nome, unidade: d.un};
    document.getElementById('prod-escolhido').textContent = '✓ ' + d.nome;
    document.getElementById('busca-res').innerHTML = '';
  },
  'cupom-vincular': d => {
    if (!T.p.sel) return toast('Escolha o produto do estoque.');
    const f = num(document.getElementById('fator').value);
    if (!(f > 0)) return toast('Quantidade por embalagem inválida.');
    acaoItemCupom({seq: +d.seq, acao: 'vincular', produto_id: T.p.sel.produto_id, fator: f});
  },
  'cupom-novo-produto': d => modalNovoProduto(d.seq),
  'np-un': (d, el) => {
    T.p.novoUn = d.u;
    el.parentElement.querySelectorAll('.chip').forEach(b => { b.classList.toggle('sel', b.dataset.u === d.u); b.setAttribute('aria-pressed', b.dataset.u === d.u); });
  },
  'np-salvar': async (d, el) => {
    const corpo = {seq: +d.seq, nome: document.getElementById('np-nome').value.trim(), unidade: T.p.novoUn,
                   categoria: document.getElementById('np-cat').value, estoque_minimo: num(document.getElementById('np-min').value) || 0,
                   fator: num(document.getElementById('np-fator').value)};
    if (corpo.nome.length < 3) return toast('Digite o nome do produto.');
    if (!(corpo.fator > 0)) return toast('A quantidade por embalagem precisa ser maior que zero.');
    el.disabled = true;
    try {
      const c = await api('POST', `/api/compras/cupons/${T.p.id}/itens/novo-produto`, corpo);
      guardarCupom(c); fecharModal(); toast('Produto cadastrado e vinculado.'); desenhar();
    } catch (e) { el.disabled = false; toast(e.extra.offline ? 'Sem internet: conecte para cadastrar.' : e.message); }
  },
  'cupom-ignorar': d => acaoItemCupom({seq: +d.seq, acao: 'ignorar'}),
  'cupom-desfazer': d => acaoItemCupom({seq: +d.seq, acao: ''}),
  'cupom-lancar': async () => {
    const c = E.cupons.find(x => x.id === T.p.id);
    if (!confirm(`Lançar ${c.itens.filter(i => i.situacao !== 'ignorado').length} item(ns) no estoque como compra de ${c.emitente}?`)) return;
    try {
      const r = await api('POST', `/api/compras/cupons/${T.p.id}/lancar`);
      guardarCupom(r); toast('Cupom lançado no estoque.'); desenhar();
      if (r.aumentos && r.aumentos.length) abrirModal(`<div class="titulo-sec">📈 Preços que subiram</div>
        <div class="mini suave">Comparado com a compra anterior de cada produto:</div>
        <div class="linhas">${r.aumentos.map(t => `<div class="lin pequeno" style="padding:9px 10px">${esc(t)}</div>`).join('')}</div>
        <button class="btn claro medio" data-acao="fechar-modal">Entendi</button>`);
    }
    catch (e) { toast(e.extra.offline ? 'Sem internet: conecte para lançar.' : e.message); if (!e.extra.offline) acoes['cupom-abrir']({id: T.p.id}); }
  },
  'cupom-de-novo': async () => {
    toast('Consultando a SEFAZ…');
    try { guardarCupom(await api('POST', `/api/compras/cupons/${T.p.id}/tentar-de-novo`)); desenhar(); }
    catch (e) { toast(e.message); }
  },
  'cupom-apagar': async () => {
    if (!confirm('Apagar este cupom do app? (Nada no estoque muda.)')) return;
    try { await api('DELETE', `/api/compras/cupons/${T.p.id}`); E.cupons = E.cupons.filter(x => x.id !== T.p.id); salvar(); acoes['cupom-voltar'](); }
    catch (e) { toast(e.message); }
  },
  'fechar-modal': () => { fecharModal(); if (T.nome === 'rotina') desenhar(); },
};
const acoesChange = {
  'cupom-foto': async (d, el) => {
    const arq = el.files && el.files[0];
    if (!arq) return;
    el.value = '';
    statusCupom('Procurando o QR Code na foto…');
    const lista = d.lista || null;
    const texto = await lerQrNoCelular(arq);
    if (texto) return enviarCupom({qr: texto, lista_codigo: lista});
    statusCupom('Não achei o QR na foto: tentando no servidor…');
    try { enviarCupom({foto: await reduzirFoto(arq), lista_codigo: lista}); }
    catch (e) { statusCupom('⚠ Não consegui abrir a foto. Tente de novo.'); }
  },
  'cupom-pagina': async (d, el) => {   // [CUPOM NO COMPUTADOR] página da SEFAZ salva com Ctrl+S
    const arq = el.files && el.files[0];
    el.value = '';
    if (!arq) return;
    if (arq.size > 3 * 1024 * 1024) return statusCupom('⚠ Arquivo grande demais: salve só a página do cupom (.html).');
    statusCupom('Lendo a página salva…');
    enviarCupom({pagina: await arq.text(), lista_codigo: d.lista || null});
  },
  'rot-nome': (d, el) => { T.p.r.nome = el.value; },
  'rot-so-contagem': (d, el) => { T.p.r.so_contagem = el.checked; desenhar(); },
  'rot-cob': (d, el) => { T.p.r.dias_cobertura = parseInt(el.value, 10) || 0; },
  'rot-prazo': (d, el) => { T.p.r.prazo_dias = parseInt(el.value, 10) || 0; },
  'rot-secao': (d, el) => { T.p.r.itens[+d.k].secao = el.value.trim(); },
  'rot-forn': (d, el) => { const id = +d.id, f = T.p.r.fornecedores; T.p.r.fornecedores = el.checked ? [...new Set([...f, id])] : f.filter(x => x !== id); },
};
async function carregarFornecedores() {
  try { T.p.fornecedores = await api('GET', '/api/compras/fornecedores'); if (T.nome === 'rotina') desenhar(); } catch (e) {}
}
function confirmarDigitadoSemPular() {
  // número digitado e a pessoa tocou em outro item (ou em "Lista"): guarda o número antes
  const it = itemAtual(), v = num(T.p.buf || '');
  if (v != null && v >= 0 && v <= 1000000) gravarLinha(linhaAtual(), v * fatorAtual(it));
  T.p.buf = '';
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-acao]');
  if (!el || el.disabled) return;
  const f = acoes[el.dataset.acao];
  if (f) { e.preventDefault(); f(el.dataset, el); }
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-acao-change]');
  if (el && acoesChange[el.dataset.acaoChange]) acoesChange[el.dataset.acaoChange](el.dataset, el);
});
document.addEventListener('input', e => {
  const el = e.target.closest('input[data-acao-change]');
  if (el && el.type !== 'checkbox' && el.type !== 'file' && acoesChange[el.dataset.acaoChange]) acoesChange[el.dataset.acaoChange](el.dataset, el);
});

// ================================================================= INÍCIO DO APP
(async function iniciar() {
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('/compras/sw.js', {scope: '/compras/'}).catch(() => {});
  }
  if (!E.usuario) { ir('login', {}); return carregarUsuarios(); }
  ir('inicio');
  try {
    const r = await api('GET', '/api/compras/eu');
    E.usuario = r.usuario; salvar();
  } catch (e) {
    if (!e.extra.offline) { ir('login', {}); return carregarUsuarios(); }
  }
  carregarInicio(); sincronizar(); carregarCodigos();
})();
</script>
