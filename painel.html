<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Gestão</title>
    <link rel="stylesheet" href="estilo.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div id="fireworks-container"></div>
    <div class="painel-container">
        
        <header class="cabecalho">
            <h1>Painel de Gestão de Tarefas</h1>
            <p id="ultima-atualizacao">Atualizando...</p>
            <div class="progresso-container">
                <div class="progresso-barra" id="progresso-barra-interna"></div>
                <span class="progresso-texto" id="progresso-texto-label">Calculando...</span>
            </div>
        </header>
        
        <div class="top-info-wrapper">

            <div class="metas-coluna-esquerda">
                <div class="meta-container" id="container-meta-mensal">
                    <h3 id="meta-titulo">Meta Faturamento Mensal</h3>
                    <div class="meta-progresso-container">
                        <div class="meta-progresso-barra" id="meta-progresso-barra"></div>
                        <span class="meta-progresso-texto" id="meta-progresso-texto">--%</span>
                    </div>
                    <div class="meta-valores">
                        <span id="meta-valor-atingido">R$ 0,00</span> / <span id="meta-valor-total">R$ 0,00</span>
                    </div>
                </div>
                <div class="meta-container" id="container-meta-diaria">
                    <h3 id="meta-diaria-titulo">Meta do Dia</h3>
                    <div class="meta-progresso-container">
                        <div class="meta-progresso-barra" id="meta-diaria-progresso-barra"></div>
                        <span class="meta-progresso-texto" id="meta-diaria-progresso-texto">--%</span>
                    </div>
                    <div class="meta-valores">
                        <span id="meta-diaria-valor-atingido">R$ 0,00</span> / <span id="meta-diaria-valor-total">R$ 0,00</span>
                        <span class="toggle-lucro-hist global" id="toggle-lucro-hist" title="Mostrar/Ocultar Histórico de Performance">👁️</span>
                    </div>
                </div>
            </div>
            <div class="historico-lucro-container" id="historico-lucro-container">
            <h3>Histórico de Performance (Equipe)</h3>
            <div class="historico-lucro-barras" id="historico-lucro-barras">
                </div>
        </div>
       
            <div class="podio-container" id="podio-diario">
                </div>

            <div class="agendamentos-container">
                <h3 class="agendamentos-titulo">Próximos Agendamentos</h3>
                <div class="agendamentos-lista" id="lista-proximos-agendamentos">
                    </div>
            </div>

        </div>



        <main class="kanban-board">
            <div class="coluna">
                <h2 class="coluna-titulo">PARA FAZER (Hoje & Ontem)</h2>
                <div class="coluna-cards" id="coluna-para-fazer"></div>
            </div>
            <div class="coluna">
                <h2 class="coluna-titulo">EM VALIDAÇÃO</h2>
                <div class="coluna-cards" id="coluna-validacao"></div>
            </div>
            <div class="coluna">
                <h2 class="coluna-titulo">CONCLUÍDAS HOJE</h2>
                <div class="coluna-cards" id="coluna-concluidas"></div>
            </div>
        </main>

        <div class="feed-container">
            <h2>Atividade Recente</h2>
            <ul id="feed-lista">
            </ul>
        </div>

    </div>

    <script src="painel.js" defer></script>
</body>
</html>
