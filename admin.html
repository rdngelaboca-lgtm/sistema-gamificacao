<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Escala - Admin</title>
    
    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script> <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> <style>
        /* --- ESTILOS GERAIS --- */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 0; }
        
        /* --- TELA DE LOGIN --- */
        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #2c3e50; z-index: 9999;
            display: flex; justify-content: center; align-items: center;
        }
        .login-box {
            background: white; padding: 40px; border-radius: 10px; text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 300px;
        }
        .login-box input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; }
        .btn-login { background: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px; }
        .btn-login:hover { background: #2980b9; }

        /* --- PAINEL PRINCIPAL (Oculto até logar) --- */
        #admin-panel { display: none; padding: 20px; }
        
        /* Cabeçalho de Ações */
        .toolbar {
            background: white; padding: 15px; border-radius: 8px; margin-bottom: 20px;
            display: flex; gap: 15px; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .toolbar input[type="date"] { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .btn-action { padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-refresh { background-color: #27ae60; color: white; }
        
        /* --- MAPA INTERATIVO --- */
        #mapa-container {
            position: relative;
            width: 1200px; /* Largura fixa para manter coordenas do Desktop */
            height: 800px; /* Ajuste conforme sua imagem */
            background-image: url('assets/layout_loja.png');
            background-size: cover; /* ou contain */
            background-repeat: no-repeat;
            border: 2px solid #333;
            margin: 0 auto;
            overflow: hidden; /* Evita que bonecos saiam da caixa */
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        /* O "Bonequinho" (Avatar) */
        .avatar-funcionario {
            position: absolute;
            width: 100px;
            background-color: rgba(255, 255, 255, 0.9);
            border: 2px solid #3498db;
            border-radius: 8px;
            padding: 5px;
            text-align: center;
            cursor: grab; /* Mãozinha de pegar */
            user-select: none;
            touch-action: none; /* Importante para funcionar no celular */
            font-size: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.1s, box-shadow 0.2s;
        }
        .avatar-funcionario:active { cursor: grabbing; box-shadow: 0 8px 12px rgba(0,0,0,0.3); z-index: 1000; }
        .avatar-nome { font-weight: bold; display: block; margin-bottom: 2px; color: #2c3e50; }
        .avatar-hora { font-size: 10px; color: #555; }

        /* --- MODAL (JANELINHA) --- */
        #modal-editar {
            display: none; /* Escondido por padrão */
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5); z-index: 2000;
            justify-content: center; align-items: center;
        }
        .modal-content {
            background: white; width: 90%; max-width: 400px;
            padding: 25px; border-radius: 10px; position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: slideDown 0.3s ease-out;
        }
        @keyframes slideDown { from {transform: translateY(-50px); opacity: 0;} to {transform: translateY(0); opacity: 1;} }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .btn-cancel { background: #e74c3c; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
        .btn-save { background: #2980b9; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }

    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-box">
            <h2>🔐 Acesso Gestor</h2>
            <input type="password" id="senha-admin" placeholder="Digite a senha..." onkeyup="if(event.key==='Enter') realizarLogin()">
            <button class="btn-login" onclick="realizarLogin()">Entrar</button>
            <p id="msg-erro" style="color: red; display: none; margin-top: 10px;">Senha incorreta!</p>
        </div>
    </div>

    <div id="admin-panel">
        <div class="toolbar">
            <label>📅 Visualizando dia:</label>
            <input type="date" id="data-selecionada" onchange="carregarEscala()">
            <button class="btn-action btn-refresh" onclick="carregarEscala()">🔄 Atualizar</button>
            <div style="margin-left: auto;">
                <span style="color: #777; font-size: 12px; margin-right: 10px;">Arraste para mover • Clique para editar</span>
                <button class="btn-action" style="background:#e74c3c; color:white;" onclick="logout()">Sair</button>
            </div>
        </div>

        <div id="mapa-container">
            </div>
    </div>

    <div id="modal-editar">
        <div class="modal-content">
            <h3 id="modal-titulo">Editar Horário</h3>
            <input type="hidden" id="edit-id"> <div class="form-row" style="display: flex; gap: 10px;">
                <div class="form-group" style="flex:1;">
                    <label>Entrada:</label>
                    <input type="time" id="edit-entrada">
                </div>
                <div class="form-group" style="flex:1;">
                    <label>Saída:</label>
                    <input type="time" id="edit-saida">
                </div>
            </div>

            <div class="form-row" style="display: flex; gap: 10px;">
                <div class="form-group" style="flex:1;">
                    <label>Início Intervalo:</label>
                    <input type="time" id="edit-int-ini">
                </div>
                <div class="form-group" style="flex:1;">
                    <label>Fim Intervalo:</label>
                    <input type="time" id="edit-int-fim">
                </div>
            </div>

            <div class="modal-actions">
                <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
                <button class="btn-save" onclick="salvarAlteracoes()">💾 Salvar</button>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
